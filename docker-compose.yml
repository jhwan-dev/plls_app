services:
  postgres:
    image: postgres:16-alpine
    container_name: plls_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plls}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plls_password}
      POSTGRES_DB: ${POSTGRES_DB:-plls_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - plls_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-plls} -d ${POSTGRES_DB:-plls_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: plls_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@plls.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - plls_pgadmin_data:/var/lib/pgadmin
    profiles:
      - tools

volumes:
  plls_postgres_data:
  plls_pgadmin_data:
